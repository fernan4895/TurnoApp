server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/turnopro_db?useSSL=false&serverTimezone=America/Mexico_City}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Mexico_City
spring.jackson.time-zone=America/Mexico_City
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}
app.admin.username=${ADMIN_INITIAL_USERNAME:}
app.admin.password=${ADMIN_INITIAL_PASSWORD:}
