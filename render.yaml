services:
  - type: web
    name: turnopro-api
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "3600000"
      - key: ADMIN_INITIAL_USERNAME
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
